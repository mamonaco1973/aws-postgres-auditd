# ==============================================================================
# Drop-in for postgresql@18-main.service
# ==============================================================================
# The benchmarks read CPU time, bytes read and peak memory from the cgroup.
# Children started by file_fdw's "program" (sh, zcat, ausearch, awk) run in
# the same cgroup, so their cost is counted with the backend's.
# ==============================================================================
[Service]
CPUAccounting=yes
IOAccounting=yes
MemoryAccounting=yes
