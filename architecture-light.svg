<svg xmlns="http://www.w3.org/2000/svg" width="1690" height="790" viewBox="0 0 1690 790" role="img" aria-label="A browser reaches pgweb on port 80 and signs in as audit_reader. pgweb queries PostgreSQL on localhost. The audit_fdw schema's foreign tables run wrapper scripts on every query, which pipe the whole /var/log/audit chain, oldest file first, through zcat and ausearch. auditd appends kernel events for the watched /data directory to the chain. Separately, audit-ingest runs every 60 seconds, reads new events with an ausearch checkpoint and copies them into the indexed audit_native.events table. audit-rotate runs the ingest, compresses the previous file and signals auditd to start a new one. The database passwords are in Secrets Manager."><defs><marker id="a_e_http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_pw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_sql" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_sqln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_prog" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="a_e_ckpt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#137e77"/></marker><marker id="a_e_copy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#137e77"/></marker><marker id="a_e_append" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="a_e_watch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475467"/></marker><marker id="a_e_rot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker></defs><rect width="1690" height="790" fill="#ffffff"/><path d="M250.0,150 V235" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_http)"/><text x="264.0" y="201.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">HTTP :80</text><path d="M810.0,150 V235" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a_e_pw)"/><text x="824.0" y="201.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">passwords at boot</text><path d="M460,295.0 H595" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_sql)"/><text x="530.0" y="283.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">localhost:5432</text><path d="M250.0,350 V435" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_sqln)"/><text x="264.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">SQL</text><path d="M1020,295.0 H1155" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_prog)"/><text x="1090.0" y="283.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">program</text><path d="M1370.0,350 V435" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#a_e_read)"/><text x="1384.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8250df" stroke="#ffffff" stroke-width="6" paint-order="stroke">read all, oldest first</text><path d="M1020,495.0 H1155" fill="none" stroke="#137e77" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a_e_ckpt)"/><text x="1090.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#137e77" stroke="#ffffff" stroke-width="6" paint-order="stroke">--checkpoint</text><path d="M600,495.0 H465" fill="none" stroke="#137e77" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a_e_copy)"/><text x="530.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#137e77" stroke="#ffffff" stroke-width="6" paint-order="stroke">COPY</text><path d="M1370.0,640 V555" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#a_e_append)"/><text x="1384.0" y="601.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8250df" stroke="#ffffff" stroke-width="6" paint-order="stroke">append</text><path